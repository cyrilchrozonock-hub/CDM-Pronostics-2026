<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CdM 2026 — Pronostics</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════
   SCREEN STYLES
══════════════════════════════════════ */
:root {
  --ink: #0B0F1A;
  --ink2: #141C2E;
  --ink3: #1C2840;
  --gold: #F0C03A;
  --gold2: #D4A820;
  --lime: #B8FF47;
  --red: #FF3B3B;
  --white: #F0F4FF;
  --muted: #5A7090;
  --brd: #1E3050;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--ink);
  color: var(--white);
  font-family: 'Barlow', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── BG ── */
.bg-stripe {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    repeating-linear-gradient(
      -55deg,
      transparent 0px, transparent 40px,
      rgba(255,255,255,0.012) 40px, rgba(255,255,255,0.012) 41px
    );
}
.bg-glow {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 60% 35% at 50% 0%, rgba(240,192,58,0.1) 0%, transparent 70%),
    radial-gradient(ellipse 40% 40% at 0% 100%, rgba(184,255,71,0.05) 0%, transparent 60%);
}

/* ══ HERO / LOGIN ══ */
#screen-login {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--ink);
  overflow: hidden;
}
.hero-bg {
  position: absolute; inset: 0; pointer-events: none; overflow: hidden;
}
.hero-bg::before {
  content: '26';
  font-family: 'Bebas Neue', sans-serif;
  font-size: 60vw; line-height: 1;
  color: rgba(240,192,58,0.04);
  position: absolute; bottom: -10%; right: -5%;
  pointer-events: none; white-space: nowrap;
}
.hero-line {
  width: 100%; height: 4px;
  background: linear-gradient(90deg, var(--lime), var(--gold), var(--red));
  position: absolute; top: 0;
}

.login-wrap {
  position: relative; z-index: 1;
  display: flex; flex-direction: column; align-items: center; gap: 32px;
  padding: 20px;
  width: 100%;
}
.login-hero-txt { text-align: center; }
.lh-top {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(18px, 4vw, 22px);
  letter-spacing: 8px; color: var(--gold);
  text-transform: uppercase; margin-bottom: 4px;
}
.lh-main {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(64px, 18vw, 130px);
  letter-spacing: 4px; line-height: .85;
  color: var(--white);
}
.lh-main span { color: var(--gold); }
.lh-sub {
  font-family: 'Oswald', sans-serif;
  font-size: clamp(11px, 2.5vw, 14px);
  letter-spacing: 5px; text-transform: uppercase;
  color: var(--muted); margin-top: 10px;
}

.login-card {
  background: var(--ink2);
  border: 1px solid var(--brd);
  border-top: 3px solid var(--gold);
  border-radius: 14px;
  padding: 28px 28px 24px;
  width: min(380px, 94vw);
  box-shadow: 0 24px 60px rgba(0,0,0,0.6);
}
.login-card label {
  display: block;
  font-family: 'Oswald', sans-serif;
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 8px;
}
.login-card input {
  width: 100%;
  background: var(--ink);
  border: 1px solid var(--brd);
  border-radius: 8px;
  color: var(--white);
  padding: 14px 16px;
  font-family: 'Oswald', sans-serif;
  font-size: 22px; font-weight: 600;
  letter-spacing: 2px;
  margin-bottom: 16px;
  transition: border-color .2s;
}
.login-card input::placeholder { color: var(--muted); font-size: 16px; }
.login-card input:focus { outline: none; border-color: var(--gold); }
.btn-enter {
  width: 100%; padding: 15px;
  background: var(--gold);
  color: #000; border: none; border-radius: 8px;
  cursor: pointer;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px; letter-spacing: 4px;
  transition: all .2s;
}
.btn-enter:hover { background: var(--lime); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(184,255,71,0.3); }
.btn-enter:disabled { opacity: .3; cursor: not-allowed; transform: none; box-shadow: none; }

/* ══ APP ══ */
#app { display: none; position: relative; z-index: 1; }

/* ── TOP BAR ── */
.topbar {
  position: sticky; top: 0; z-index: 50;
  background: rgba(11,15,26,0.97);
  border-bottom: 1px solid var(--brd);
  backdrop-filter: blur(10px);
}
.topbar-inner {
  max-width: 960px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px; gap: 12px; flex-wrap: wrap;
}
.topbar-brand {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px; letter-spacing: 4px; color: var(--gold); line-height: 1;
}
.topbar-brand small {
  display: block; font-family: 'Oswald', sans-serif;
  font-size: 10px; letter-spacing: 3px; color: var(--muted); font-weight: 400;
}
.topbar-user {
  display: flex; align-items: center; gap: 10px;
}
.user-tag {
  background: var(--gold);
  color: #000;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 16px; letter-spacing: 2px;
  padding: 5px 14px; border-radius: 30px;
}
.btn-print {
  background: var(--ink3); border: 1px solid var(--brd);
  color: var(--muted); padding: 6px 14px; border-radius: 6px;
  cursor: pointer; font-family: 'Oswald', sans-serif;
  font-size: 12px; letter-spacing: 1px; transition: all .2s;
}
.btn-print:hover { border-color: var(--lime); color: var(--lime); }
.btn-quit {
  background: none; border: 1px solid var(--brd);
  color: var(--muted); padding: 5px 12px; border-radius: 6px;
  cursor: pointer; font-family: 'Oswald', sans-serif;
  font-size: 11px; letter-spacing: 1px; transition: all .2s;
}
.btn-quit:hover { border-color: var(--red); color: var(--red); }

/* ── TABS ── */
.tabs {
  display: flex;
  background: var(--ink2);
  border-bottom: 1px solid var(--brd);
  overflow-x: auto; scrollbar-width: none;
  max-width: 100%;
}
.tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  flex: 1; min-width: 80px;
  background: none; border: none; cursor: pointer;
  padding: 13px 8px 11px;
  font-family: 'Oswald', sans-serif;
  font-size: 12px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
  border-bottom: 3px solid transparent;
  transition: all .2s; white-space: nowrap;
}
.tab-btn.active { color: var(--gold); border-bottom-color: var(--gold); }

/* ── MAIN ── */
.main-wrap { max-width: 960px; margin: 0 auto; padding: 20px 14px 80px; }
.page { display: none; }
.page.active { display: block; }

/* ── SECTION TITLE ── */
.sct {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 28px; letter-spacing: 5px;
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 20px;
}
.sct-accent { color: var(--gold); }
.sct::after { content: ''; flex: 1; height: 2px; background: linear-gradient(90deg, var(--gold), transparent); }

/* ── FILTER ── */
.filters { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 20px; }
.flt {
  background: transparent; border: 1px solid var(--brd);
  color: var(--muted); padding: 5px 14px; border-radius: 30px;
  cursor: pointer; font-family: 'Oswald', sans-serif;
  font-size: 11px; font-weight: 600; letter-spacing: 2px;
  text-transform: uppercase; transition: all .2s;
}
.flt.on { border-color: var(--gold); color: var(--gold); background: rgba(240,192,58,0.08); }

/* ── MATCH CARD ── */
.mcard {
  background: var(--ink2);
  border: 1px solid var(--brd);
  border-radius: 12px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: border-color .2s, transform .15s;
}
.mcard:hover { border-color: rgba(240,192,58,0.4); transform: translateY(-1px); }
.mcard.done { border-left: 4px solid var(--lime); }

.mcard-top {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 4px;
  padding: 7px 14px;
  background: rgba(0,0,0,0.3);
  font-family: 'Oswald', sans-serif; font-size: 11px; letter-spacing: 2px;
}
.mc-group { color: var(--gold); font-weight: 700; }
.mc-date { color: var(--muted); }
.mc-st-open { color: var(--lime); }
.mc-st-done { color: var(--lime); }
.mc-st-saved { color: var(--gold); }

.mcard-teams {
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 8px;
  padding: 14px 16px;
}
.team { display: flex; align-items: center; gap: 8px; min-width: 0; }
.team.away { flex-direction: row-reverse; }
.t-flag { font-size: 26px; flex-shrink: 0; }
.t-name { font-family: 'Oswald', sans-serif; font-size: 15px; font-weight: 600; line-height: 1.1; }
.vs-zone { text-align: center; min-width: 64px; }
.vs-score { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); letter-spacing: 3px; line-height: 1; }
.vs-txt { font-family: 'Bebas Neue', sans-serif; font-size: 14px; color: var(--muted); letter-spacing: 3px; }

.mcard-prono {
  padding: 10px 14px 14px;
  background: rgba(0,0,0,0.2);
  border-top: 1px solid rgba(30,48,80,0.7);
}
.plbl { font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.choices { display: flex; gap: 7px; margin-bottom: 10px; flex-wrap: wrap; }
.ch-btn {
  flex: 1; min-width: 80px; padding: 8px 6px;
  background: var(--ink3); border: 1px solid var(--brd);
  color: var(--white); border-radius: 7px; cursor: pointer;
  font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 600;
  text-align: center; transition: all .15s; line-height: 1.3;
}
.ch-btn:hover { border-color: var(--gold); color: var(--gold); }
.ch-btn.sel { background: var(--gold); border-color: var(--gold); color: #000; font-weight: 700; }

.score-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.sc-lbl { font-family: 'Oswald', sans-serif; font-size: 11px; color: var(--muted); letter-spacing: 1px; flex-shrink: 0; }
.sc-in {
  width: 50px; height: 38px;
  background: var(--ink); border: 1px solid var(--brd);
  color: var(--white); text-align: center;
  border-radius: 7px; font-size: 18px; font-weight: 700;
  font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px;
}
.sc-in:focus { outline: none; border-color: var(--gold); }
.sc-sep { color: var(--muted); font-weight: 700; font-size: 18px; }

.btn-save {
  width: 100%; padding: 9px;
  background: var(--ink3); border: 1px solid var(--lime);
  color: var(--lime); border-radius: 7px; cursor: pointer;
  font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase; transition: all .2s;
}
.btn-save:hover { background: var(--lime); color: #000; }
.btn-save.saved { background: rgba(184,255,71,0.12); color: var(--lime); }

.pts-tag {
  display: inline-flex; align-items: center;
  background: rgba(240,192,58,0.15); border: 1px solid rgba(240,192,58,0.3);
  color: var(--gold); font-family: 'Bebas Neue', sans-serif; font-size: 13px;
  padding: 2px 9px; border-radius: 20px; margin-left: 8px; letter-spacing: 1px;
}

.prono-recap {
  font-family: 'Oswald', sans-serif; font-size: 12px; color: var(--muted);
  margin-top: 4px; padding: 7px 10px;
  background: rgba(0,0,0,0.2); border-radius: 7px;
}
.prono-recap strong { color: var(--white); }

/* ── CLASSEMENT ── */
.rank-wrap { overflow: hidden; border-radius: 12px; border: 1px solid var(--brd); }
.rank-head {
  display: grid; grid-template-columns: 48px 1fr 140px 70px;
  padding: 10px 16px;
  background: rgba(0,0,0,0.4);
  font-family: 'Oswald', sans-serif; font-size: 10px; letter-spacing: 2px;
  text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--brd);
}
.rank-row {
  display: grid; grid-template-columns: 48px 1fr 140px 70px;
  padding: 12px 16px; align-items: center;
  border-bottom: 1px solid rgba(30,48,80,0.4);
  background: var(--ink2);
  transition: background .15s;
}
.rank-row:last-child { border-bottom: none; }
.rank-row:hover { background: var(--ink3); }
.rank-row.r1 { background: rgba(240,192,58,0.08); }
.rk-num { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--muted); }
.rk-num.g { color: var(--gold); }
.rk-num.s { color: #B0B8C8; }
.rk-num.b { color: #A06830; }
.rk-name { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 600; }
.rk-v { font-family: 'Barlow', sans-serif; font-size: 12px; color: var(--lime); }
.rk-pts { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--gold); text-align: right; }

/* ── VAINQUEUR ── */
.vc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px,1fr)); gap: 8px; }
.vc-btn {
  background: var(--ink3); border: 1px solid var(--brd);
  border-radius: 10px; padding: 10px 6px; text-align: center;
  cursor: pointer; transition: all .18s; color: var(--white);
}
.vc-btn:hover { border-color: var(--gold); }
.vc-btn.sel { border-color: var(--gold); background: rgba(240,192,58,0.12); }
.vc-flag { font-size: 22px; display: block; margin-bottom: 4px; }
.vc-name { font-family: 'Oswald', sans-serif; font-size: 11px; font-weight: 600; line-height: 1.2; }

/* ── REGLES ── */
.rule { display: flex; gap: 16px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid rgba(30,48,80,0.4); }
.rule:last-child { border-bottom: none; }
.rule-pts-box {
  min-width: 56px; text-align: center;
  background: rgba(240,192,58,0.08); border: 1px solid rgba(240,192,58,0.25);
  border-radius: 10px; padding: 6px 4px;
}
.rule-num { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--gold); line-height: 1; }
.rule-lbl { font-family: 'Oswald', sans-serif; font-size: 9px; color: var(--muted); letter-spacing: 1px; }
.rule-txt { font-size: 14px; line-height: 1.6; }
.rule-txt strong { display: block; font-family: 'Oswald', sans-serif; font-size: 15px; color: var(--white); margin-bottom: 3px; letter-spacing: .5px; }

/* ── CARD ── */
.card { background: var(--ink2); border: 1px solid var(--brd); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
.card-hd { background: rgba(0,0,0,0.3); padding: 12px 16px; border-bottom: 1px solid var(--brd); font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--white); }
.card-bd { padding: 16px; }

/* ── TOAST ── */
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink3); border: 1px solid var(--gold); color: var(--white); padding: 11px 22px; border-radius: 30px; font-family: 'Oswald', sans-serif; font-size: 13px; letter-spacing: 1px; opacity: 0; transition: opacity .3s; z-index: 9999; pointer-events: none; white-space: nowrap; }
#toast.show { opacity: 1; }

/* ══════════════════════════════════════
   PRINT STYLES
══════════════════════════════════════ */
@media print {
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  body { background: #fff !important; color: #000 !important; font-family: Arial, sans-serif; }
  #screen-login, .topbar, .tabs, .filters, #page-vainqueur, #page-regles, #page-classement,
  .btn-save, .choices, .score-row, .btn-print, .btn-quit, .bg-stripe, .bg-glow { display: none !important; }
  #app { display: block !important; }
  #page-pronostics { display: block !important; }
  .main-wrap { padding: 0 !important; max-width: 100% !important; }

  .print-header {
    display: flex !important;
    align-items: center; justify-content: space-between;
    border-bottom: 3px solid #000; padding-bottom: 10px; margin-bottom: 16px;
  }
  .print-title { font-family: Arial Black, sans-serif; font-size: 22px; font-weight: 900; letter-spacing: 2px; }
  .print-player { font-size: 14px; font-weight: 700; border: 2px solid #000; padding: 4px 12px; border-radius: 4px; }
  .print-date { font-size: 11px; color: #666; }

  .sct { display: none !important; }

  .mcard {
    background: #fff !important; border: 1px solid #ccc !important;
    border-radius: 0 !important; margin-bottom: 6px !important;
    page-break-inside: avoid; border-left: none !important;
  }
  .mcard-top { background: #f0f0f0 !important; padding: 4px 10px !important; }
  .mc-group { color: #000 !important; font-size: 10px; }
  .mc-date { color: #444 !important; font-size: 10px; }
  .mc-st-open, .mc-st-done, .mc-st-saved { display: none; }

  .mcard-teams { padding: 6px 10px !important; gap: 4px !important; }
  .t-flag { font-size: 18px !important; }
  .t-name { font-size: 12px !important; color: #000 !important; }
  .vs-score { font-size: 18px !important; color: #000 !important; }
  .vs-txt { color: #999 !important; font-size: 12px !important; }

  .mcard-prono { padding: 4px 10px 8px !important; background: #fff !important; border-top: 1px solid #eee !important; }
  .plbl { color: #666 !important; font-size: 9px !important; margin-bottom: 4px !important; }

  .prono-recap {
    background: #f8f8f8 !important; border: 1px solid #ddd !important;
    color: #000 !important; font-size: 11px !important; padding: 4px 8px !important;
  }
  .prono-recap strong { color: #000 !important; }
  .pts-tag { background: #ffe !important; border: 1px solid #cc0 !important; color: #664 !important; }

  .no-prono-print { color: #999 !important; font-style: italic; font-size: 11px; }

  /* 2 colonnes en impression */
  #mlist { display: grid !important; grid-template-columns: 1fr 1fr; gap: 6px; }
}

@media (max-width: 480px) {
  .t-name { font-size: 12px; }
  .t-flag { font-size: 20px; }
  .rank-head, .rank-row { grid-template-columns: 38px 1fr 100px 55px; }
}
</style>
</head>
<body>
<div class="bg-stripe"></div>
<div class="bg-glow"></div>

<!-- ══ ECRAN LOGIN ══ -->
<div id="screen-login">
  <div class="hero-bg"></div>
  <div class="hero-line"></div>
  <div class="login-wrap">
    <div class="login-hero-txt">
      <div class="lh-top">SPIP Moselle &mdash; Edition 2026</div>
      <div class="lh-main">CDM<br><span>2026</span></div>
      <div class="lh-sub">Challenge Pronostics</div>
    </div>
    <div class="login-card">
      <label for="inp-name">Votre nom / initiales</label>
      <input type="text" id="inp-name" placeholder="Ex : Cyril C. ou CC" maxlength="30" autocomplete="off">
      <button class="btn-enter" id="btn-enter">Entrer &rarr;</button>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand">
        CDM 2026
        <small>Challenge Pronostics &middot; SPIP Moselle</small>
      </div>
      <div class="topbar-user">
        <span class="user-tag" id="ut-name">-</span>
        <button class="btn-print" onclick="window.print()">&#128438; Imprimer</button>
        <button class="btn-quit" id="btn-quit">Quitter</button>
      </div>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="pronostics">&#9917; Pronostics</button>
    <button class="tab-btn" data-tab="vainqueur">&#127942; Vainqueur</button>
    <button class="tab-btn" data-tab="classement">&#127941; Classement</button>
    <button class="tab-btn" data-tab="regles">&#128203; R&egrave;gles</button>
  </div>

  <div class="main-wrap">
    <!-- PRINT HEADER (visible only in print) -->
    <div class="print-header" style="display:none">
      <div class="print-title">CDM 2026 &mdash; Pronostics</div>
      <div class="print-player" id="pt-name">-</div>
      <div class="print-date" id="pt-date">-</div>
    </div>

    <!-- PRONOSTICS -->
    <div class="page active" id="page-pronostics">
      <div class="sct"><span class="sct-accent">&#9917;</span> Matchs &agrave; pronostiquer</div>
      <div class="filters" id="filters"></div>
      <div id="mlist"></div>
    </div>

    <!-- VAINQUEUR -->
    <div class="page" id="page-vainqueur">
      <div class="sct"><span class="sct-accent">&#127942;</span> Vainqueur de la CdM</div>
